<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sertifikat — Ardhika Raditya</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../style.css">
  <style>
    .cert-detail {
      padding: 120px 0 80px;
      max-width: 820px;
      margin: 0 auto;
    }
    .cert-back {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-family: var(--font-display);
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      color: var(--accent);
      text-decoration: none;
      margin-bottom: 40px;
      transition: gap var(--transition);
    }
    .cert-back:hover { gap: 14px; }
    .cert-title {
      font-family: var(--font-display);
      font-size: 2.2rem;
      font-weight: 700;
      color: var(--text);
      margin-bottom: 16px;
    }
    .cert-desc {
      font-size: 15px;
      color: var(--muted);
      line-height: 1.8;
      margin-bottom: 40px;
    }
    .cert-images {
      display: flex;
      flex-direction: column;
      gap: 32px;
    }
    .cert-images img {
      width: 100%;
      border-radius: 12px;
      border: 1px solid var(--border);
    }
    .cert-notfound {
      text-align: center;
      padding: 120px 0;
    }
    .cert-notfound h2 {
      font-family: var(--font-display);
      font-size: 2rem;
      margin-bottom: 16px;
    }
    .cert-notfound p {
      color: var(--muted);
      margin-bottom: 24px;
    }
    .project-link-btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-family: var(--font-display);
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      padding: 12px 28px;
      border-radius: var(--r);
      text-decoration: none;
      transition: var(--transition);
    }
    .project-link-btn--primary {
      background: var(--accent);
      color: var(--bg);
      border: 1px solid var(--accent);
    }
    .project-link-btn--primary:hover {
      background: transparent;
      color: var(--accent);
    }
    @media (max-width: 600px) {
      .cert-detail { padding: 100px 16px 60px; }
      .cert-title { font-size: 1.6rem; }
    }
  </style>
</head>
<body>

<div class="container cert-detail" id="app"></div>

<script src="cert.js"></script>
<script>
  const params = new URLSearchParams(window.location.search);
  const id = params.get('id');
  const app = document.getElementById('app');

  const cert = certificates.find(c => c.id === id);

  if (!cert) {
    app.innerHTML = `
      <div class="cert-notfound">
        <h2>Sertifikat tidak ditemukan</h2>
        <p>Sertifikat yang Anda cari tidak tersedia.</p>
        <a href="../index.html" class="project-link-btn project-link-btn--primary">Kembali ke Beranda</a>
      </div>
    `;
  } else {
    const imagesHtml = cert.images
      .filter((_, i) => i > 0)
      .map(img => `<img src="${img}" alt="${cert.title}" loading="lazy" />`)
      .join('');

    app.innerHTML = `
      <a href="../index.html" class="cert-back">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
        Kembali
      </a>
      <h1 class="cert-title">${cert.title}</h1>
      ${cert.description.split('\n\n').map(p => `<p class="cert-desc">${p}</p>`).join('')}
      <div class="cert-images">
        <img src="${cert.images[0]}" alt="${cert.title}" loading="lazy" />
        ${imagesHtml}
      </div>
    `;
  }
</script>

</body>
</html>
